<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Hub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #ff6b6b;
        }
        .navbar-brand, .nav-link {
            color: white !important;
            font-weight: bold;
        }
        .card {
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 15px;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .card img {
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            height: 200px;
            object-fit: cover;
        }
        .btn-order {
            background-color: #ff6b6b;
            color: white;
            border-radius: 20px;
        }
        .btn-order:hover {
            background-color: #ff4757;
        }
        .cart-box {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 250px;
        }
        .cart-box h5 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">🍔 Foodie Hub</a>
        <div class="ms-auto text-white">
            Cart: <span id="cart-count">0</span> | ₹<span id="total-price">0</span>
        </div>
    </div>
</nav>

<!-- Food Section -->
<div class="container mt-4">
    <div class="row">

        <!-- Food Card 1 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://source.unsplash.com/400x300/?burger" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Burger</h5>
                    <p>Delicious cheesy burger</p>
                    <h6>₹120</h6>
                    <button class="btn btn-order add-cart" data-name="Burger" data-price="120">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Food Card 2 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://source.unsplash.com/400x300/?pizza" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Pizza</h5>
                    <p>Hot cheesy pizza</p>
                    <h6>₹250</h6>
                    <button class="btn btn-order add-cart" data-name="Pizza" data-price="250">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Food Card 3 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://source.unsplash.com/400x300/?pasta" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Pasta</h5>
                    <p>Creamy white sauce pasta</p>
                    <h6>₹180</h6>
                    <button class="btn btn-order add-cart" data-name="Pasta" data-price="180">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Food Card 4 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://source.unsplash.com/400x300/?biryani" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Biryani</h5>
                    <p>Spicy chicken biryani</p>
                    <h6>₹220</h6>
                    <button class="btn btn-order add-cart" data-name="Biryani" data-price="220">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Food Card 5 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://source.unsplash.com/400x300/?noodles" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Noodles</h5>
                    <p>Hakka noodles</p>
                    <h6>₹150</h6>
                    <button class="btn btn-order add-cart" data-name="Noodles" data-price="150">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Food Card 6 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="https://source.unsplash.com/400x300/?icecream" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Ice Cream</h5>
                    <p>Cold dessert delight</p>
                    <h6>₹90</h6>
                    <button class="btn btn-order add-cart" data-name="Ice Cream" data-price="90">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Cart Box -->
<div class="cart-box">
    <h5>🛒 Cart Summary</h5>
    <ul id="cart-items" class="list-unstyled small"></ul>
    <hr>
    <strong>Total: ₹<span id="cart-total">0</span></strong>
</div>

<!-- JavaScript -->
<script>
    let cartCount = 0;
    let totalPrice = 0;

    $(".add-cart").click(function() {
        let name = $(this).data("name");
        let price = parseInt($(this).data("price"));

        cartCount++;
        totalPrice += price;

        $("#cart-count").text(cartCount);
        $("#total-price").text(totalPrice);
        $("#cart-total").text(totalPrice);

        $("#cart-items").append("<li>" + name + " - ₹" + price + "</li>");
    });
</script>

</body>
</html>
