<!-- Cart -->

<div class="cart-box">
    <h5>🛒 Cart</h5>
    <ul id="cart-items"></ul>
    <hr>
    <b>Total: ₹<span id="cart-total">0</span></b>

<!-- Toast -->

<div id="toast">Item added successfully!</div>

<script>
    let count = 0;
    let total = 0;

    $(".add-cart").click(function () {
        let name = $(this).data("name");
        let price = parseInt($(this).data("price"));

        count++;
        total += price;

        $("#cart-count").text(count);
        $("#total-price").text(total);
        $("#cart-total").text(total);

        $("#cart-items").append("<li>" + name + " - ₹" + price + "</li>");

        // Toast message
        $("#toast").fadeIn().delay(1000).fadeOut();
    });
</script>
