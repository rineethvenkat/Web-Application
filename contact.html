<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie | Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍔 Foodie</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item guest-only"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item guest-only"><a class="nav-link active" href="contact.html">Contact</a></li>
                    <li class="nav-item guest-only"><a class="nav-link" id="authLink" href="login.html">Login</a></li>
                    <li class="nav-item guest-only"><a class="btn btn-light btn-sm text-danger rounded-pill ms-2"
                            id="registerLink" href="register.html">Register</a></li>

                    <li class="nav-item user-only d-none"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link" href="cart.html">Cart <span
                                class="cart-count badge rounded-pill bg-light text-danger">0</span></a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link active" href="contact.html">Contact</a>
                    </li>
                    <li class="nav-item user-only d-none"><span class="navbar-text text-white me-2"
                            id="userNameLabel"></span></li>
                    <li class="nav-item user-only d-none"><a class="btn btn-light btn-sm text-danger rounded-pill ms-2"
                            id="logoutLink" href="#">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card p-4 h-100">
                    <h2 class="fw-bold mb-3">Contact Us</h2>
                    <p>We would love to hear from you. Share your feedback or ask about your favorite dishes.</p>
                    <p><strong>Email:</strong> hello@foodie.com</p>
                    <p><strong>Phone:</strong> +91 98765 43210</p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card p-4">
                    <form id="contactForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input id="contactName" class="form-control" placeholder="Your name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input id="contactEmail" class="form-control" placeholder="Your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea id="contactMessage" class="form-control" rows="4"
                                placeholder="How can we help?"></textarea>
                        </div>
                        <button class="btn btn-danger" type="submit">Send</button>
                        <p id="contactMsg" class="mt-3"></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
