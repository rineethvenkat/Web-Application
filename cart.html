<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie | Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍔 Foodie</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item guest-only"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item guest-only"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item guest-only"><a class="nav-link" id="authLink" href="login.html">Login</a></li>
                    <li class="nav-item guest-only"><a class="btn btn-light btn-sm text-danger rounded-pill ms-2"
                            id="registerLink" href="register.html">Register</a></li>

                    <li class="nav-item user-only d-none"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link active" href="cart.html">Cart <span
                                class="cart-count badge rounded-pill bg-light text-danger">0</span></a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item user-only d-none"><span class="navbar-text text-white me-2"
                            id="userNameLabel"></span></li>
                    <li class="nav-item user-only d-none"><a class="btn btn-light btn-sm text-danger rounded-pill ms-2"
                            id="logoutLink" href="#">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4 align-items-start">
            <div class="col-lg-8">
                <div class="card p-4">
                    <h2 class="fw-bold mb-3">Your Cart 🛒</h2>
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cartTable"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card p-4">
                    <h4 class="fw-bold">Summary</h4>
                    <p class="text-muted">Review your order, then place it when you are ready.</p>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Total</span>
                        <strong>₹<span id="grandTotal">0</span></strong>
                    </div>
                    <button class="btn btn-danger w-100" onclick="placeOrder()">Place Order</button>
                    <p id="orderMsg" class="mt-3"></p>
                </div>

                <div class="card p-4 mt-4">
                    <h4 class="fw-bold">Order History</h4>
                    <div id="orderHistory" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
