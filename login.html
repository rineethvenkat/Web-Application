<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍔 Foodie</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item guest-only"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item guest-only"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item guest-only"><a class="nav-link active" id="authLink" href="login.html">Login</a>
                    </li>
                    <li class="nav-item guest-only"><a class="btn btn-light btn-sm text-danger rounded-pill ms-2"
                            id="registerLink" href="register.html">Register</a></li>

                    <li class="nav-item user-only d-none"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link" href="cart.html">Cart <span
                                class="cart-count badge rounded-pill bg-light text-danger">0</span></a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item user-only d-none"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item user-only d-none"><span class="navbar-text text-white me-2"
                            id="userNameLabel"></span></li>
                    <li class="nav-item user-only d-none"><a class="btn btn-light btn-sm text-danger rounded-pill ms-2"
                            id="logoutLink" href="#">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="fw-bold mb-3">Welcome Back</h2>
                    <p class="text-muted">Log in to continue your delicious order.</p>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input id="loginEmail" class="form-control" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input id="loginPass" type="password" class="form-control"
                                placeholder="Enter your password">
                        </div>
                        <button class="btn btn-danger w-100" type="submit">Login</button>
                        <p id="loginMsg" class="mt-3"></p>
                        <p class="text-center mt-3 mb-0">New here? <a href="register.html">Create an account</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
